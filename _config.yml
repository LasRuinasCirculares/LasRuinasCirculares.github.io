locale: "en-US"
site_theme: "default"
title: "Jun Zhang"
title_separator: "-"
name: &name "Jun Zhang"
description: &description "Academic homepage of Jun Zhang, an M.Sc. student at ISCAS researching trustworthy and agentic large language models."
url: "https://lasruinascirculares.github.io"
baseurl: ""
repository: "LasRuinasCirculares/LasRuinasCirculares.github.io"

author:
  avatar: "profile.jpg"
  name: "Jun Zhang 张俊"
  bio: "M.Sc. student at ISCAS researching trustworthy and agentic LLMs."
  location: "Beijing, China"
  employer: "Institute of Software, Chinese Academy of Sciences"
  googlescholar: "https://scholar.google.com/citations?user=CE84N3AAAAAJ&hl=en"
  github: "LasRuinasCirculares"

teaser:
breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"

comments:
  provider: false

atom_feed:
  hide: true

social:
  type: Person
  name: "Jun Zhang"
  links:
    - "https://github.com/LasRuinasCirculares"
    - "https://scholar.google.com/citations?user=CE84N3AAAAAJ&hl=en"

analytics:
  provider: false

include:
  - _pages
exclude:
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - README.md
  - vendor

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
